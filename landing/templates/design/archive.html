<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Tasks</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    body { background-color: #e2e2e2; font-family: 'Segoe UI', sans-serif; }
    .navbar { position: relative;  border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin: 1rem auto; width: 90%; background-color: white !important; }
    .navbar-brand { font-weight: 600; }
    .nav-link { color: #333 !important; border-radius: 8px; transition: all 0.2s ease-in-out; }
    .nav-link:hover { background-color: #007bff; color: #fff !important; } 
    .content-box { background: white; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 2rem; width: 90%; margin: 2rem auto; }
    .todo-container { background: white; border-radius: 16px; padding: 2rem; width: 500px; margin: 2rem auto; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
    .todo-input { display: flex; gap: 10px; margin-bottom: 1rem; }
    .todo-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .todo-input button { background-color: #3fdfff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .todo-input button:hover { background-color: #38c9e6; }
    .todo-list { list-style: none; padding: 0; }
    .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f3f2f2; border-radius: 8px; margin-bottom: 10px; }
    .todo-actions button { background: none; border: none; color: #8e4bff; cursor: pointer; margin-left: -5px; }
    .todo-actions button:hover { color: #5e2dbf; }
    .archived { text-decoration: line-through; color: gray; }
    
    /* NavbarNav styles */
    #navbarNav { background-color: transparent; }
    #navbarNav .navbar-nav { gap: 0.5rem; }
    #navbarNav .nav-link { color: #333 !important; border-radius: 8px; transition: all 0.2s ease-in-out; }
    #navbarNav .nav-link:hover { background-color: #007bff; color: #fff !important; }
    
    /* Navbar toggler button (collapse button) */
    .navbar-toggler { border: 2px solid #007bff; border-radius: 8px; padding: 0.5rem 0.75rem; transition: all 0.2s ease-in-out; }
    .navbar-toggler:hover { background-color: #007bff; border-color: #0056b3; }
    .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(0, 123, 255, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }
    .navbar-toggler:hover .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }

    /* Theme toggle pill */
    .theme-toggle { display: inline-flex; align-items: center; gap: .5rem; border-radius: 999px; padding: .35rem .75rem; border: 1px solid #d1d5db; background: #ffffff; color: #111827; cursor: pointer; transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .theme-toggle:hover { box-shadow: 0 6px 14px rgba(0,0,0,0.1); }
    .theme-toggle .icon { font-size: 1rem; line-height: 1; display: inline-block; width: 1.1rem; text-align: center; }
    .theme-toggle .label { font-size: .875rem; font-weight: 600; }
    
    /* Theme toggle positioning - pwedeng i-adjust ang position dito */
    #themeToggle { 
    position: absolute; 
    top: 1rem; 
    right: 5rem;
    margin-left: auto; 
    }

    /* Dark theme overrides */
    [data-theme="dark"] body { background-color: #0f1115; color: #e5e7eb; }
    [data-theme="dark"] .navbar { background-color: #1f2430 !important; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    [data-theme="dark"] .nav-link { color: #e5e7eb !important; }
    [data-theme="dark"] .nav-link:hover { background-color: #2563eb; color: #fff !important; }
    [data-theme="dark"] .content-box { background: #161a22; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    [data-theme="dark"] .todo-container { background: #1b2030; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
    [data-theme="dark"] .todo-item { background: #0f1523; color: #9ca3af; }
    [data-theme="dark"] .todo-actions button, [data-theme="dark"] .todo-actions a { color: #a78bfa; }
    [data-theme="dark"] .todo-actions button:hover, [data-theme="dark"] .todo-actions a:hover { color: #8b5cf6; }
    [data-theme="dark"] .theme-toggle { background: #232939; color: #e5e7eb; border-color: #e5e7eb; } /* triple lines */
    [data-theme="dark"] .theme-toggle:hover { box-shadow: 0 6px 14px rgba(0,0,0,0.35); } 
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="navbar-brand d-flex align-items-center">
      <a class="mr-2" href="{% url 'home' %}">My Django Project</a>
      <button id="themeToggle" class="theme-toggle ml-2" type="button">
        <span class="icon" aria-hidden="true">🌙</span>
        <span class="label">Dark</span>
      </button>
    </div>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'archived_tasks' %}">Archive</a></li>
      </ul>
    </div>
  </nav>

  <div class="content-box">
    <div class="todo-container">
      <div class="nav-actions">
        <a href="{% url 'home' %}">← Back to Active Tasks</a>
      </div>
      <h3 class="text-center mb-3">Archived Tasks</h3>
      <ul class="todo-list">
        {% for task in tasks %}
          <li class="todo-item">
            <span>{{ task.name }}</span>
            <div class="todo-actions">
              <form method="POST" action="{% url 'toggle_archive' task.id %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{% url 'archived_tasks' %}">
                <button type="submit" title="Unarchive">🔓</button>
              </form>
              <a href="{% url 'edit_task' task.id %}?next={% url 'archived_tasks' %}" title="Edit">✏️</a>
              <form method="POST" action="{% url 'delete_task' task.id %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{% url 'archived_tasks' %}">
                <button type="submit" title="Delete">🗑️</button>
              </form>
            </div>
          </li>
        {% empty %}
          <li>No archived tasks.</li>
        {% endfor %}
      </ul>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      function setTheme(next) {
        if (next === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try { localStorage.setItem('theme', next); } catch (e) {}
        var btn = document.getElementById('themeToggle');
        if (btn) {
          var icon = btn.querySelector('.icon');
          var label = btn.querySelector('.label');
          if (document.documentElement.getAttribute('data-theme') === 'dark') {
            if (icon) icon.textContent = '🌞';
            if (label) label.textContent = 'Light';
          } else {
            if (icon) icon.textContent = '🌙';
            if (label) label.textContent = 'Dark';
          }
        }
      }
      var btn = document.getElementById('themeToggle');
      if (btn) {
        btn.addEventListener('click', function() {
          var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          setTheme(isDark ? 'light' : 'dark');
        });
        var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        setTheme(current);
      }
    })();
  </script>
</body>
</html>
